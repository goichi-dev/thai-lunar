name: Bug report
description: A wrong date, a panic, or anything else not working as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For a **wrong date**, the most important field is the source you checked
        against. Online converters often use the Chinese or Vietnamese lunar
        calendar, which genuinely differs from the Thai one.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did the library return, and what did you expect instead?
      placeholder: |
        FromGregorian(2026, time.May, 31) returned เดือน 7,
        but I expected เดือน 6.
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Source for the expected date
      description: >
        Where did you read the correct date? A printed ปฏิทินหลวง, a government
        holiday announcement, the Royal Institute's tables, a specific website.
      placeholder: ปฏิทินหลวง พ.ศ. 2569, หน้า ...
    validations:
      required: false

  - type: textarea
    id: repro
    attributes:
      label: Reproducer
      description: The smallest program that shows the problem.
      render: go
      placeholder: |
        package main

        import (
            "fmt"
            "time"

            thailunar "github.com/goichi-dev/thai-lunar"
        )

        func main() {
            fmt.Println(thailunar.FromGregorian(2026, time.May, 31))
        }
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Library version
      placeholder: v0.1.0, or a commit hash
    validations:
      required: true

  - type: input
    id: goversion
    attributes:
      label: Go version and OS
      placeholder: go1.26.0, linux/amd64
    validations:
      required: true
